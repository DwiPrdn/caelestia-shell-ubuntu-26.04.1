# Starship config — Catppuccin Mocha
# Docs: https://starship.rs/config/

format = """
[](surface0)\
$os\
$username\
[](bg:peach fg:surface0)\
$directory\
[](fg:peach bg:green)\
$git_branch\
$git_status\
[](fg:green bg:teal)\
$cmd_duration\
[](fg:teal bg:blue)\
$python\
$nodejs\
[](fg:blue)\
$line_break\
$character"""

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"

[os]
disabled = false
style = "bg:surface0 fg:text"

[os.symbols]
Ubuntu = " "
Arch   = " "

[username]
show_always = true
style_user  = "bg:surface0 fg:text"
style_root  = "bg:surface0 fg:red"
format      = "[ $user ]($style)"

[directory]
style            = "fg:mantle bg:peach"
format           = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music"     = "󰝚 "
"Pictures"  = " "
"Videos"    = " "
"Projects"  = "󰲋 "

[git_branch]
symbol = " "
style  = "bg:green fg:mantle"
format = "[[ $symbol $branch ](fg:mantle bg:green)]($style)"

[git_status]
style  = "bg:green fg:mantle"
format = "[[($all_status$ahead_behind )](fg:mantle bg:green)]($style)"

[cmd_duration]
min_time = 2000
style    = "bg:teal fg:mantle"
format   = "[[ 󱦟 $duration ](fg:mantle bg:teal)]($style)"

[python]
symbol = " "
style  = "bg:blue fg:mantle"
format = "[[ $symbol $version ](fg:mantle bg:blue)]($style)"

[nodejs]
symbol = " "
style  = "bg:blue fg:mantle"
format = "[[ $symbol $version ](fg:mantle bg:blue)]($style)"

[character]
success_symbol = "[❯](bold mauve)"
error_symbol   = "[❯](bold red)"
